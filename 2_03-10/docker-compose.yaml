services:
  backend:
    image: abhisheksivan/backend
    ports:
      - 8080:8080
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    restart: unless-stopped
    depends_on:
      - redis
      - db

  frontend:
    image: abhisheksivan/frontend
    ports:
      - 5001:5001

  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    restart: unless-stopped
    volumes:
      - ./database:/var/lib/postgresql
  redis:
    image: redis
    restart: unless-stopped
